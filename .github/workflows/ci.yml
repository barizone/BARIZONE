name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: barizone_test
          POSTGRES_USER: barizone
          POSTGRES_PASSWORD: barizone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U barizone" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e test (backend + frontend)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: barizone-jar
          path: target/barizone.jar
          retention-days: 7

  # Immagine Docker su GitHub Container Registry, solo per main e staging.
  # Il deploy dipende dall'hosting scelto: vedi docs/DEPLOY.md.
  image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/barizone:${{ github.ref_name }}
